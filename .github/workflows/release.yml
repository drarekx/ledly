name: Release

# Releases are published from the Mac with ./release.sh, signed with the Apple Development
# certificate (an ad-hoc CI build would make macOS ask for Screen Recording after every update).
# This workflow is only a manual fallback: run it from Actions to get an ad-hoc build artifact,
# or with a tag selected to publish an ad-hoc release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" ./build-app.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && shasum -a 256 Ledly.zip | awk '{print $1}' > Ledly.zip.sha256)
          gh release create "$GITHUB_REF_NAME" build/Ledly.zip build/Ledly.zip.sha256 \
            --title "Ledly $GITHUB_REF_NAME" --generate-notes

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Ledly
          path: build/Ledly.zip
