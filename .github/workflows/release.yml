name: Release

# Push a tag like v1.2.0 to build Ledly.app (universal) and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" ./build-app.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && shasum -a 256 Ledly.zip | awk '{print $1}' > Ledly.zip.sha256)
          gh release create "$GITHUB_REF_NAME" build/Ledly.zip build/Ledly.zip.sha256 \
            --title "Ledly $GITHUB_REF_NAME" --generate-notes

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Ledly
          path: build/Ledly.zip
